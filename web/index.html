<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0b0e14">
<title>dominion</title>
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" href="/apple-touch-icon.png" sizes="180x180">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="stylesheet" href="/vendor/xterm.css">
<link rel="stylesheet" href="/style.css">
<script>
  // Apply the saved theme before first paint to avoid a flash.
  (function () {
    try {
      var t = localStorage.getItem("dominion.theme") || "dark";
      if (t === "light") document.documentElement.dataset.theme = "light";
    } catch (e) {}
  })();
</script>
</head>
<body>
  <div id="app" hidden>
    <header id="bar">
      <button id="menu-toggle" type="button" aria-expanded="false" aria-controls="drawer" aria-label="Show sessions">
        <span class="hamburger" aria-hidden="true"></span>
      </button>
      <span id="current" class="current" aria-hidden="true"></span>
      <div id="drawer">
        <div id="drawer-head">
          <span>Sessions</span>
          <button id="drawer-close" type="button" aria-label="Close menu">&times;</button>
        </div>
        <div id="tablist" role="tablist" aria-label="tmux sessions" aria-orientation="horizontal"></div>
      </div>
      <div id="actions">
        <span id="status" class="status" role="status" aria-live="polite"></span>
        <button id="keys-toggle" type="button" aria-pressed="false" title="Toggle keys" aria-label="Show terminal keys">&#x2328;</button>
        <button id="new-session" type="button" title="New session" aria-label="New session">&#x2b;</button>
        <button id="settings" type="button" title="Settings" aria-label="Settings">
          <svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true" focusable="false">
            <circle cx="12" cy="12" r="3.2" fill="none" stroke="currentColor" stroke-width="2"/>
            <path d="M12 2.5v2.6M12 18.9v2.6M2.5 12h2.6M18.9 12h2.6M5.3 5.3l1.8 1.8M16.9 16.9l1.8 1.8M18.7 5.3l-1.8 1.8M7.1 16.9l-1.8 1.8"
                  fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          </svg>
        </button>
        <button id="lock" type="button" title="Lock" aria-label="Lock">
          <svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true" focusable="false">
            <path d="M7 10V7a5 5 0 0 1 10 0v3" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            <rect x="4.5" y="10" width="15" height="10.5" rx="2" fill="none" stroke="currentColor" stroke-width="2"/>
          </svg>
        </button>
        <button id="logout" type="button" title="Log out" aria-label="Log out">&#x23FB;</button>
      </div>
    </header>
    <div id="scrim" class="scrim"></div>
    <main id="terminals"></main>
    <div id="keys" role="toolbar" aria-label="Terminal keys" hidden>
      <button class="key" type="button" data-key="esc" aria-label="Escape">Esc</button>
      <button class="key" type="button" data-key="tab" aria-label="Tab">Tab</button>
      <button class="key key-mod" type="button" data-mod="ctrl" aria-pressed="false" aria-label="Control">Ctrl</button>
      <button class="key key-mod" type="button" data-mod="alt" aria-pressed="false" aria-label="Alt">Alt</button>
      <button class="key key-arrow" type="button" data-key="left" aria-label="Arrow left">&#x2190;</button>
      <button class="key key-arrow" type="button" data-key="up" aria-label="Arrow up">&#x2191;</button>
      <button class="key key-arrow" type="button" data-key="down" aria-label="Arrow down">&#x2193;</button>
      <button class="key key-arrow" type="button" data-key="right" aria-label="Arrow right">&#x2192;</button>
    </div>
    <div id="empty" class="empty" hidden>
      <p>No tmux sessions found.</p>
      <p class="muted">Create one with <code>tmux new -s name</code>, or use the <strong>+</strong> button above.</p>
    </div>
  </div>

  <dialog id="new-dialog" class="dialog" aria-labelledby="new-title">
    <form id="new-form" method="dialog" autocomplete="off">
      <h2 id="new-title">New session</h2>
      <label for="new-name">Session name</label>
      <input id="new-name" name="name" type="text" maxlength="128" autocomplete="off" spellcheck="false">
      <p id="new-error" class="error" hidden></p>
      <div class="dialog-actions">
        <button type="button" class="btn-ghost" data-close>Cancel</button>
        <button type="submit" class="btn-primary">Create</button>
      </div>
    </form>
  </dialog>

  <dialog id="confirm-dialog" class="dialog" aria-labelledby="confirm-title">
    <form id="confirm-form" method="dialog">
      <h2 id="confirm-title">Kill session</h2>
      <p id="confirm-text" class="dialog-text"></p>
      <p id="confirm-error" class="error" hidden></p>
      <div class="dialog-actions">
        <button type="button" class="btn-ghost" data-close>Cancel</button>
        <button type="submit" class="btn-danger" id="confirm-kill">Kill</button>
      </div>
    </form>
  </dialog>

  <dialog id="settings-dialog" class="dialog" aria-labelledby="settings-title">
    <form id="settings-form" method="dialog">
      <h2 id="settings-title">Settings</h2>
      <p class="dialog-label">Appearance</p>
      <div class="seg" role="group" aria-label="Theme">
        <button type="button" class="seg-btn" data-theme="dark" aria-pressed="false">Dark</button>
        <button type="button" class="seg-btn" data-theme="light" aria-pressed="false">Light</button>
      </div>
      <div id="settings-servers" hidden>
        <p class="dialog-label">Servers</p>
        <button type="button" class="btn-ghost wide" id="manage-servers">Manage servers&hellip;</button>
      </div>
      <div id="settings-pin">
        <p class="dialog-label">Change PIN</p>
        <label for="pin-current">Current PIN</label>
        <input id="pin-current" type="password" inputmode="numeric" autocomplete="off" maxlength="12">
        <label for="pin-new" class="spaced">New PIN</label>
        <input id="pin-new" type="password" inputmode="numeric" autocomplete="off" maxlength="12">
        <label for="pin-confirm" class="spaced">Confirm new PIN</label>
        <input id="pin-confirm" type="password" inputmode="numeric" autocomplete="off" maxlength="12">
        <p id="pin-error" class="error" hidden></p>
        <p id="pin-ok" class="muted" hidden>PIN updated.</p>
        <button type="button" class="btn-primary wide" id="change-pin">Update PIN</button>
      </div>
      <div class="dialog-actions">
        <button type="button" class="btn-primary" data-close>Done</button>
      </div>
    </form>
  </dialog>

  <div id="login" class="overlay">
    <form id="login-form" autocomplete="off">
      <img class="logo" src="/dom-logo.png" alt="" width="165" height="220">
      <h1>dominion</h1>
      <p class="muted" id="login-sub">Enter PIN to continue</p>
      <input id="pin" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="12" autofocus aria-label="PIN">
      <button type="submit">Unlock</button>
      <button id="change-server" type="button" class="link" hidden>Change server</button>
      <p id="login-error" class="error" hidden></p>
    </form>
  </div>

  <script src="/vendor/xterm.js"></script>
  <script src="/vendor/addon-fit.js"></script>
  <script src="/app.js"></script>
</body>
</html>
