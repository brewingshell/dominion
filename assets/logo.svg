<?xml version="1.0" encoding="UTF-8"?>
<!--
  dominion mark: an original "keep" (fortress) sigil.

  A crenellated shield with a roman D formed by the gate opening and a terminal
  caret inside it. Released with the project under the MIT license; not derived
  from any third-party artwork.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 400" width="256" height="400"
     role="img" aria-label="dominion">
  <defs>
    <linearGradient id="shield" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8b2020"/>
      <stop offset="0.55" stop-color="#5a1414"/>
      <stop offset="1" stop-color="#3d0e0e"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d76a6a"/>
      <stop offset="1" stop-color="#8b2020"/>
    </linearGradient>
  </defs>

  <!-- Keep silhouette: flat, crenellated top tapering to a point. -->
  <path d="M128 8
           L232 52
           L232 150
           C232 250 190 330 128 392
           C66 330 24 250 24 150
           L24 52 Z"
        fill="url(#shield)" stroke="url(#edge)" stroke-width="6" stroke-linejoin="round"/>

  <!-- Crenellations along the top edge. -->
  <path d="M24 52 L64 35 L64 60 L104 43 L104 68 L152 68 L152 43 L192 60 L192 35 L232 52"
        fill="none" stroke="url(#edge)" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- Gate: the shape reads as a barred roman D. -->
  <path d="M92 128
           L92 236
           L128 236
           C162 236 180 208 180 182
           C180 156 162 128 128 128 Z"
        fill="none" stroke="#f3d6d6" stroke-width="11" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- Terminal caret inside the gate. -->
  <path d="M112 160 L136 182 L112 204" fill="none" stroke="#ffb4b4" stroke-width="10"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Base rule. -->
  <line x1="86" y1="264" x2="170" y2="264" stroke="#f3d6d6" stroke-width="8" stroke-linecap="round"/>
  <line x1="102" y1="286" x2="154" y2="286" stroke="#ffb4b4" stroke-width="6" stroke-linecap="round"/>
</svg>
