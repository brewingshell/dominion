<?xml version="1.0" encoding="UTF-8"?>
<!--
  dominion mark: an original dark-red castle (keep with two towers), 3:4.

  Crenellated towers flanking a central keep, with an arched gate holding a
  terminal caret. Released with the project under the MIT license; not derived
  from any third-party artwork.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 400" width="300" height="400"
     role="img" aria-label="dominion">
  <defs>
    <linearGradient id="keep" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8b2020"/>
      <stop offset="0.55" stop-color="#5a1414"/>
      <stop offset="1" stop-color="#3d0e0e"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d76a6a"/>
      <stop offset="1" stop-color="#8b2020"/>
    </linearGradient>
  </defs>

  <!-- Castle silhouette: left tower, central keep, right tower, flat base. -->
  <path d="M30 350
           L30 50
           L48 50 L48 72
           L57 72 L57 50
           L75 50 L75 72
           L84 72 L84 50
           L102 50
           L102 94
           L117 94 L117 116
           L129 116 L129 94
           L144 94 L144 116
           L156 116 L156 94
           L171 94 L171 116
           L183 116 L183 94
           L198 94
           L198 50
           L216 50 L216 72
           L225 72 L225 50
           L243 50 L243 72
           L252 72 L252 50
           L270 50
           L270 350 Z"
        fill="url(#keep)" stroke="url(#edge)" stroke-width="6" stroke-linejoin="round"/>

  <!-- A large, centered "D" (roman D, not a gate). -->
  <path d="M92 164
           L92 320
           L150 320
           C186 320 208 286 208 242
           C208 198 186 164 150 164
           Z"
        fill="#2a0a0a" stroke="#f3d6d6" stroke-width="8" stroke-linejoin="round"/>

  <!-- Terminal caret inside the D. -->
  <path d="M128 210 L157 242 L128 274" fill="none" stroke="#ffb4b4" stroke-width="11"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
