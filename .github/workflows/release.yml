name: Release

# Cut a combined release from a version tag, or dry-run it by hand. The build
# logic lives in release.sh; this workflow only provisions the toolchain, writes
# the CA secret, and runs that script so local and CI releases stay identical.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: Version to build (without the leading v)
        required: true
        default: "0.0.2"
      publish:
        description: Publish a GitHub release
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/package-lock.json

      # jlink is required by Capacitor's Android toolchain.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # The action's default "packages" includes the removed legacy "tools"
      # package, so it fails during setup. Install only what the build needs
      # here, after accepting the licences.
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Desktop client build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev imagemagick

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('apps/android/**/*.gradle*') }}
          restore-keys: gradle-${{ runner.os }}-

      # The bundled APK CA must be the project's canonical CA, not a per-run
      # throwaway. It is stored base64-encoded to survive secret newline rules.
      - name: Write the CA secret
        env:
          CA_B64: ${{ secrets.DOMINION_CA_PEM_B64 }}
        run: |
          if [ -z "$CA_B64" ]; then
            echo "::error::secret DOMINION_CA_PEM_B64 is not set; see v0.0.2.md" >&2
            exit 1
          fi
          printf '%s' "$CA_B64" | base64 -d > "$RUNNER_TEMP/ci-ca.pem"

      - name: Resolve version
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            v="${{ inputs.version }}"
          else
            v="${GITHUB_REF_NAME#v}"
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Build and publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOMINION_CA: ${{ runner.temp }}/ci-ca.pem
          DOMINION_VERSION: ${{ steps.ver.outputs.version }}
        run: |
          extra=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.publish }}" != "true" ]; then
            extra="--no-publish"
          fi
          ./release.sh "$DOMINION_VERSION" $extra

      - uses: actions/upload-artifact@v4
        with:
          name: dominion-${{ steps.ver.outputs.version }}
          path: dist/
          if-no-files-found: error
          retention-days: 14
