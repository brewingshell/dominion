name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: true
      - name: gofmt
        run: test -z "$(gofmt -l .)"
      - name: vet
        run: go vet ./...
      - name: test
        run: go test ./...

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: syntax
        run: node --check web/app.js
      - name: test
        run: npm test

  desktop:
    # The desktop shell is a separate Go module that links the system WebKitGTK,
    # so it needs its own job with the cgo build dependencies installed.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: true
      - name: install GTK/WebKit dev packages
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev
      - name: embedded www is in sync
        run: |
          diff -q apps/www/index.html apps/desktop/www/index.html
          diff -q apps/www/bootstrap.js apps/desktop/www/bootstrap.js
      - name: pkg-config shim
        run: ./gen-pkgconfig.sh
        working-directory: apps/desktop
      - name: gofmt
        run: test -z "$(gofmt -l .)"
        working-directory: apps/desktop
      - name: vet
        run: go vet ./...
        working-directory: apps/desktop
        env:
          PKG_CONFIG_PATH: ${{ github.workspace }}/apps/desktop/.pkgconfig
      - name: test
        run: go test ./...
        working-directory: apps/desktop
        env:
          PKG_CONFIG_PATH: ${{ github.workspace }}/apps/desktop/.pkgconfig
