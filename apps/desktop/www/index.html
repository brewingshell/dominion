<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>dominion</title>
<style>
  :root { --bg:#0b0e14; --panel:#12151f; --border:#232838; --text:#c7ccd6; --muted:#6b7385; --accent:#7aa2f7; --err:#f7768e; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--text);
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { height:100%; display:grid; place-items:center; padding:24px;
    background: radial-gradient(1000px 600px at 50% -10%, #182036 0%, var(--bg) 60%); }
  form { width:min(92vw,340px); padding:26px; background:var(--panel); border:1px solid var(--border);
    border-radius:14px; box-shadow:0 24px 60px rgba(0,0,0,.45); }
  h1 { margin:0 0 4px; font-size:20px; letter-spacing:.14em; font-weight:600; }
  p.sub { margin:0 0 18px; color:var(--muted); font-size:13px; }
  label { display:block; margin-bottom:6px; font-size:12px; text-transform:uppercase; letter-spacing:.08em; color:var(--muted); }
  input { width:100%; padding:11px 13px; font-size:16px; color:var(--text); background:var(--bg);
    border:1px solid var(--border); border-radius:8px; outline:none; }
  input:focus { border-color:var(--accent); box-shadow:0 0 0 3px rgba(122,162,247,.18); }
  button { width:100%; margin-top:14px; padding:11px 14px; font-size:14px; font-weight:600;
    color:#0b0e14; background:var(--accent); border:none; border-radius:8px; cursor:pointer; }
  button:disabled { opacity:.6; cursor:default; }
  #force { color:var(--text); background:transparent; border:1px solid var(--border); }
  #force:hover { border-color:var(--accent); }
  .err { margin:12px 0 0; color:var(--err); font-size:13px; }
  .row { display:flex; gap:10px; align-items:center; margin-top:14px; font-size:12px; color:var(--muted); }
  .row input { width:auto; }
  .link { margin-top:10px; color:var(--muted); background:transparent; border:none; font-weight:500; }
  .link:hover { color:var(--text); }
  h2 { margin:22px 0 8px; font-size:12px; text-transform:uppercase; letter-spacing:.08em; color:var(--muted); font-weight:600; }
  h2:first-of-type { margin-top:6px; }
  ul.hosts { list-style:none; margin:0; padding:0; }
  ul.hosts li { display:flex; align-items:center; gap:10px; padding:9px 0; border-top:1px solid var(--border); }
  ul.hosts li .meta { flex:1; min-width:0; }
  ul.hosts .hname { display:block; font-size:14px; color:var(--text); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  ul.hosts .hurl { display:block; font-size:12px; color:var(--muted); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  ul.hosts button { width:auto; margin:0; padding:7px 10px; font-size:12px; }
  .host-del { color:var(--err); background:transparent; border:1px solid var(--border); }
  .host-del:hover { border-color:var(--err); }
  .empty-hosts { margin:6px 0 0; font-size:13px; color:var(--muted); }
  #view-settings { display:none; }
  body[data-view="settings"] #view-connect { display:none; }
  body[data-view="settings"] #view-settings { display:block; }
</style>
</head>
<body>
<main>
  <form id="view-connect">
    <h1>dominion</h1>
    <p class="sub">Enter the portal address</p>
    <label for="host">Host and port</label>
    <input id="host" type="text" inputmode="url" autocomplete="off" autocapitalize="off"
           spellcheck="false" placeholder="YOUR-HOST:5550">
    <div class="row">
      <input id="insecure" type="checkbox">
      <label for="insecure" style="margin:0;text-transform:none;letter-spacing:0;font-size:12px">Connect over plain HTTP instead of HTTPS</label>
    </div>
    <button id="go" type="submit">Connect</button>
    <button id="force" type="button" hidden>Connect anyway</button>
    <button id="open-settings" type="button" class="link">Settings</button>
    <p id="error" class="err" hidden></p>
  </form>

  <form id="view-settings">
    <h1>Settings</h1>
    <p class="sub">Servers</p>
    <label for="s-host">Host and port</label>
    <input id="s-host" type="text" inputmode="url" autocomplete="off" autocapitalize="off"
           spellcheck="false" placeholder="YOUR-HOST:5550">
    <div class="row">
      <input id="s-insecure" type="checkbox">
      <label for="s-insecure" style="margin:0;text-transform:none;letter-spacing:0;font-size:12px">Use plain HTTP instead of HTTPS</label>
    </div>
    <label for="s-name" style="margin-top:14px">Save as (optional)</label>
    <input id="s-name" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="name for this server">
    <button id="s-apply" type="submit">Connect</button>
    <button id="s-save" type="button">Save this server</button>

    <h2>Saved servers</h2>
    <ul class="hosts" id="host-list"></ul>
    <p class="empty-hosts" id="hosts-empty" hidden>No saved servers yet.</p>

    <button id="close-settings" type="button" class="link">Back</button>
    <p id="s-error" class="err" hidden></p>
  </form>
</main>
<script src="bootstrap.js"></script>
</body>
</html>
